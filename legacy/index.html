<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#101523">
<title>TripBudget · 다음 여행을 발견하세요</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
:root{color-scheme:dark;--bg:#101523;--panel:#1b2436;--text:#f5f7ff;--muted:#b9c5dc;--accent:#baff65}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:20px system-ui,-apple-system,"Segoe UI",sans-serif}
button,input{font:inherit}button{min-height:60px;padding:14px 24px;border:0;border-radius:16px;font-weight:800;cursor:pointer;touch-action:manipulation}
button:disabled{opacity:.55;cursor:wait}button:focus-visible,input:focus-visible,a:focus-visible{outline:4px solid #ffcd63;outline-offset:4px}
.topbar{position:fixed;inset:0 0 auto;z-index:2000;min-height:96px;display:flex;align-items:center;justify-content:space-between;gap:16px;padding:14px 28px;background:#101523f5;border-bottom:1px solid #344056}
.brand{font-size:26px;font-weight:900;letter-spacing:-1px}.brand span{color:var(--accent)}.brand small{display:block;font-size:11px;letter-spacing:3px;color:var(--muted);margin-top:4px}
.modes{display:flex;gap:8px}.mode,.reset{background:#293449;color:var(--text)}.mode[aria-pressed="true"]{background:var(--accent);color:#172314}
main{max-width:1440px;margin:auto;padding:132px 28px 48px}.eyebrow{color:var(--accent);font-size:15px;font-weight:800;letter-spacing:2px}
h1{font-size:clamp(32px,4vw,54px);letter-spacing:-2px;margin:12px 0}.description{color:var(--muted);margin:0 0 24px;line-height:1.6}
.controls{padding:24px;background:var(--panel);border:1px solid #344056;border-radius:24px;margin-bottom:18px}
label{display:block;font-weight:800;margin-bottom:12px}.input-row{display:flex;gap:14px}.input-wrap{position:relative;flex:1}
input{width:100%;min-height:70px;padding:14px 60px 14px 20px;background:#101827;color:white;border:2px solid #53637c;border-radius:16px;font-size:28px}
.unit{position:absolute;right:22px;top:22px;color:var(--muted)}.primary{background:var(--accent);color:#172314}.hint{margin:12px 0 0;font-size:16px;color:var(--muted)}
#dartButton{width:100%;min-height:86px;font-size:28px;background:#b6a2ff;color:#201641}[hidden]{display:none!important}
#status{min-height:32px;margin:18px 0;font-weight:700;color:#d8e8ff}.map-shell{position:relative;isolation:isolate;overflow:hidden;border-radius:24px;border:1px solid #43516c;background:#d5e1e8}
#map{height:clamp(360px,49vh,620px);width:100%}.leaflet-container{font-family:inherit;color-scheme:light}.leaflet-control-zoom a{width:48px!important;height:48px!important;line-height:48px!important}
.city-icon{background:transparent;border:0}.pin{display:grid;place-items:center;width:48px;height:48px;border:3px solid white;border-radius:50%;background:#364fc7;color:white;font-size:23px;box-shadow:0 4px 16px #0006}
.pin.winner{background:#7829c9;animation:pop .5s ease-out}.leaflet-tooltip{font-size:17px;font-weight:700}
#dart{position:absolute;left:0;top:0;z-index:1000;width:64px;height:64px;display:grid;place-items:center;font-size:54px;pointer-events:none;filter:drop-shadow(0 10px 8px #0007);will-change:transform}
#celebration{position:absolute;inset:0;z-index:1100;overflow:hidden;pointer-events:none}.confetti{position:absolute;top:-30px;width:12px;height:22px;animation:fall 1.8s ease-in forwards}
@keyframes fall{to{transform:translate(var(--drift),680px) rotate(650deg);opacity:0}}@keyframes pop{0%{transform:scale(.3)}65%{transform:scale(1.3)}100%{transform:scale(1)}}
#result{margin-top:24px;padding:28px;background:var(--panel);border:1px solid #3b4b65;border-radius:24px;scroll-margin-top:120px}
.result-heading{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:20px;margin-bottom:24px}h2{margin:8px 0;font-size:36px}.cost{color:var(--accent);font-size:30px;font-weight:900}
.places{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}.place{overflow:hidden;border-radius:18px;background:#111b2d}.place img{display:block;width:100%;height:170px;object-fit:cover}.place h3{font-size:21px;margin:18px}
footer{margin-top:22px;color:var(--muted);font-size:15px;line-height:1.7}
@media(max-width:900px){.topbar{height:160px;padding:12px;flex-wrap:wrap;gap:8px}.brand{display:none}.modes{width:100%}.mode{flex:1;padding:12px}.reset{width:100%;min-height:52px;padding:10px}main{padding:184px 16px 32px}.input-row{flex-direction:column}.places{grid-template-columns:1fr}.controls,#result{padding:20px}#result{scroll-margin-top:180px}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>
</head>
<body>
<header class="topbar">
<div class="brand">Trip<span>Budget</span><small>DEVDAY · TRAVEL LAB</small></div>
<nav class="modes" aria-label="여행 추천 모드">
<button class="mode" id="modeA" type="button" aria-pressed="true">A · 예산 맞춤</button>
<button class="mode" id="modeB" type="button" aria-pressed="false">B · 랜덤 다트</button>
</nav>
<button class="reset" id="resetButton" type="button">↺ 초기화(처음으로)</button>
</header>
<main>
<div class="eyebrow">YOUR NEXT DESTINATION</div>
<h1 id="title">내 예산으로 어디까지 갈까?</h1>
<p class="description" id="description">예산을 입력하고 지도에서 마음에 드는 여행지를 골라보세요.</p>
<section class="controls" aria-label="추천 조건">
<form id="budgetForm" novalidate>
<label for="budget">여행 예산</label>
<div class="input-row"><div class="input-wrap">
<input id="budget" type="text" inputmode="numeric" autocomplete="off" placeholder="예: 1,500,000" aria-describedby="budgetHint" maxlength="15"><span class="unit">원</span>
</div><button class="primary" id="recommendButton" type="submit">추천받기 →</button></div>
<p class="hint" id="budgetHint">1인 · 3박 4일 · 교통, 숙박, 식비를 포함한 시연용 예산</p>
</form>
<div id="dartControls" hidden><button id="dartButton" type="button">🎯 지도에 펜 던지기</button><p class="hint">예산은 잠시 잊고, 우연이 고른 여행지로 떠나보세요.</p></div>
</section>
<p id="status" role="status" aria-live="polite">지도를 준비하고 있어요.</p>
<div class="map-shell"><div id="map" aria-label="추천 여행지 지도"></div><div id="dart" aria-hidden="true" hidden>📍</div><div id="celebration" aria-hidden="true"></div></div>
<section id="result" aria-label="선택한 여행지 상세 정보" hidden></section>
<footer>경비는 실제 판매 가격이 아닌 시연용 예시이며 출발지·시즌에 따라 달라집니다.<br>관광지 이미지는 사진 Placeholder입니다. 지도 표시에는 인터넷 연결이 필요합니다.</footer>
</main>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
"use strict";
const cities = [
{cityName:"부산 · 대한민국",lat:35.1796,lng:129.0756,estimatedCost:350000,recommendedPlaces:["해운대 해수욕장","감천문화마을","광안대교"]},
{cityName:"제주 · 대한민국",lat:33.4996,lng:126.5312,estimatedCost:500000,recommendedPlaces:["성산일출봉","협재 해수욕장","한라산"]},
{cityName:"하노이 · 베트남",lat:21.0278,lng:105.8342,estimatedCost:650000,recommendedPlaces:["호안끼엠 호수","하노이 구시가지","문묘"]},
{cityName:"다낭 · 베트남",lat:16.0544,lng:108.2022,estimatedCost:700000,recommendedPlaces:["미케 해변","바나힐","오행산"]},
{cityName:"방콕 · 태국",lat:13.7563,lng:100.5018,estimatedCost:850000,recommendedPlaces:["왓 아룬","왕궁","짜뚜짝 시장"]},
{cityName:"타이베이 · 대만",lat:25.033,lng:121.5654,estimatedCost:900000,recommendedPlaces:["타이베이 101","용산사","스린 야시장"]},
{cityName:"오사카 · 일본",lat:34.6937,lng:135.5023,estimatedCost:1000000,recommendedPlaces:["도톤보리","오사카성","신세카이"]},
{cityName:"도쿄 · 일본",lat:35.6762,lng:139.6503,estimatedCost:1200000,recommendedPlaces:["센소지","시부야 스크램블","도쿄타워"]},
{cityName:"싱가포르",lat:1.3521,lng:103.8198,estimatedCost:1500000,recommendedPlaces:["가든스 바이 더 베이","마리나 베이","센토사"]},
{cityName:"시드니 · 호주",lat:-33.8688,lng:151.2093,estimatedCost:2200000,recommendedPlaces:["오페라 하우스","본다이 비치","하버 브리지"]},
{cityName:"로마 · 이탈리아",lat:41.9028,lng:12.4964,estimatedCost:2500000,recommendedPlaces:["콜로세움","트레비 분수","판테온"]},
{cityName:"파리 · 프랑스",lat:48.8566,lng:2.3522,estimatedCost:2800000,recommendedPlaces:["에펠탑","루브르 박물관","몽마르트르"]},
{cityName:"케이프타운 · 남아프리카공화국",lat:-33.9249,lng:18.4241,estimatedCost:2900000,recommendedPlaces:["테이블 마운틴","볼더스 비치","워터프런트"]},
{cityName:"뉴욕 · 미국",lat:40.7128,lng:-74.006,estimatedCost:3200000,recommendedPlaces:["센트럴 파크","타임스 스퀘어","자유의 여신상"]},
{cityName:"리우데자네이루 · 브라질",lat:-22.9068,lng:-43.1729,estimatedCost:3500000,recommendedPlaces:["코르코바두","코파카바나 해변","슈거로프산"]}
];
const $ = id => document.getElementById(id);
const money = amount => amount.toLocaleString("ko-KR") + "원";
const reducedMotion = matchMedia("(prefers-reduced-motion: reduce)");
let map, markerLayer, mode="A", busy=false, generation=0, dartAnimation=null, confettiTimer=null;
function setStatus(message){$("status").textContent=message}
function resetView(){map.setView([20,35],2,{animate:false})}
function setMapInteraction(enabled){
 ["dragging","touchZoom","doubleClickZoom","scrollWheelZoom","boxZoom","keyboard"].forEach(name=>{
  if(map[name])map[name][enabled?"enable":"disable"]();
 });
 if(enabled)map.zoomControl.addTo(map);else map.zoomControl.remove();
}
function clearEffects(){
 generation++;
 if(dartAnimation)dartAnimation.cancel();
 dartAnimation=null;clearTimeout(confettiTimer);
 $("dart").hidden=true;$("celebration").replaceChildren();busy=false;
 $("dartButton").disabled=!map;$("dartButton").textContent="🎯 지도에 펜 던지기";
 if(map){map.stop();setMapInteraction(true)}
}
function switchMode(nextMode){
 clearEffects();mode=nextMode;
 $("modeA").setAttribute("aria-pressed",String(mode==="A"));
 $("modeB").setAttribute("aria-pressed",String(mode==="B"));
 $("budgetForm").hidden=mode!=="A";$("dartControls").hidden=mode!=="B";$("result").hidden=true;
 $("title").textContent=mode==="A"?"내 예산으로 어디까지 갈까?":"운명이 고르는 다음 여행지!";
 $("description").textContent=mode==="A"?"예산을 입력하고 지도에서 마음에 드는 여행지를 골라보세요.":"펜을 던지면 세계의 도시 중 한 곳이 당신의 여행지가 됩니다.";
 if(!map){setStatus("지도 라이브러리를 불러오지 못했어요. 인터넷 연결 후 새로고침해주세요.");return}
 markerLayer.clearLayers();resetView();
 setStatus(mode==="A"?"여행 예산을 입력해주세요.":cities.length+"개 도시가 기다리고 있어요. 펜을 던져보세요!");
}
function placeholder(index){
 const colors=["#344d77","#536346","#655080"];
 const svg='<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360"><rect width="640" height="360" fill="'+colors[index%3]+'"/><circle cx="490" cy="90" r="37" fill="#fff" opacity=".55"/><path d="M0 310L180 120L340 290L440 190L640 360H0Z" fill="#fff" opacity=".18"/><text x="320" y="325" text-anchor="middle" fill="#fff" font-family="sans-serif" font-size="24">PHOTO PLACEHOLDER</text></svg>';
 return "data:image/svg+xml;charset=UTF-8,"+encodeURIComponent(svg);
}
function element(tag,className,text){
 const node=document.createElement(tag);if(className)node.className=className;if(text)node.textContent=text;return node;
}
function showCity(city,isWinner=false){
 const result=$("result");result.replaceChildren();
 const heading=element("div","result-heading"),nameBox=element("div");
 nameBox.append(element("div","eyebrow",isWinner?"🎉 오늘의 여행지 당첨!":"선택한 여행지"),element("h2","",city.cityName));
 const costBox=element("div");
 costBox.append(element("div","hint","1인 · 3박 4일 예상 경비"),element("div","cost",money(city.estimatedCost)));
 heading.append(nameBox,costBox);
 const places=element("div","places");
 city.recommendedPlaces.forEach((place,index)=>{
  const card=element("article","place"),img=element("img");
  img.src=placeholder(index);img.alt=place+" 사진 Placeholder";img.width=640;img.height=360;
  card.append(img,element("h3","",place));places.append(card);
 });
 result.append(heading,places);result.hidden=false;
 setStatus((isWinner?"🎉 당첨! ":"")+city.cityName+" · 예상 경비 "+money(city.estimatedCost));
 // 당첨 축하 효과를 가리지 않도록 다트 모드는 지도를 유지합니다.
 if(!isWinner)result.scrollIntoView({behavior:reducedMotion.matches?"instant":"smooth",block:"nearest"});
}
function addMarker(city,isWinner=false){
 const marker=L.marker([city.lat,city.lng],{
  title:city.cityName+", 예상 경비 "+money(city.estimatedCost),alt:city.cityName,keyboard:true,
  icon:L.divIcon({className:"city-icon",html:'<span class="pin'+(isWinner?' winner':'')+'">'+(isWinner?'🎯':'✈')+'</span>',iconSize:[48,48],iconAnchor:[24,24],tooltipAnchor:[0,-27]})
 });
 marker.bindTooltip(city.cityName,{direction:"top"});
 marker.on("click",()=>{if(!busy)showCity(city,isWinner)});
 marker.addTo(markerLayer);return marker;
}
function celebrate(){
 if(reducedMotion.matches)return;
 const colors=["#baff65","#b6a2ff","#ffcf67","#ff7598","#6de1ff"],fragment=document.createDocumentFragment();
 for(let i=0;i<55;i++){
  const piece=element("i","confetti");piece.style.left=Math.random()*100+"%";piece.style.background=colors[i%colors.length];
  piece.style.animationDelay=Math.random()*.25+"s";piece.style.setProperty("--drift",(Math.random()-.5)*300+"px");fragment.append(piece);
 }
 $("celebration").replaceChildren(fragment);
 confettiTimer=setTimeout(()=>$("celebration").replaceChildren(),2300);
}
$("budgetForm").addEventListener("submit",event=>{
 event.preventDefault();if(!map||mode!=="A")return;
 const raw=$("budget").value.trim(),validFormat=/^(?:\d+|\d{1,3}(?:,\d{3})+)$/.test(raw),budget=Number(raw.replaceAll(",",""));
 markerLayer.clearLayers();$("result").hidden=true;
 if(!validFormat||!Number.isSafeInteger(budget)||budget<=0){
  setStatus("예산을 0보다 큰 숫자로 입력해주세요. 예: 1,500,000");$("budget").setAttribute("aria-invalid","true");$("budget").focus();return;
 }
 $("budget").removeAttribute("aria-invalid");$("budget").value=budget.toLocaleString("ko-KR");
 const matches=cities.filter(city=>budget>=city.estimatedCost);
 if(!matches.length){resetView();setStatus("조건에 맞는 도시가 없어요. 최소 예산은 "+money(Math.min(...cities.map(c=>c.estimatedCost)))+"입니다.");return}
 matches.forEach(city=>addMarker(city));
 map.fitBounds(matches.map(city=>[city.lat,city.lng]),{padding:[50,50],maxZoom:7,animate:false});
 setStatus(money(budget)+"으로 갈 수 있는 도시 "+matches.length+"곳! 마커를 눌러보세요.");
});
$("dartButton").addEventListener("click",async()=>{
 if(!map||busy||mode!=="B")return;
 clearEffects();const token=generation;busy=true;$("dartButton").disabled=true;$("dartButton").textContent="✈ 여행지를 고르는 중…";
 $("result").hidden=true;markerLayer.clearLayers();setStatus("펜이 날아갑니다… 어디에 도착할까요?");
 setMapInteraction(false);
 const city=cities[Math.floor(Math.random()*cities.length)];
 map.setView([city.lat,city.lng],4,{animate:false});
 const point=map.latLngToContainerPoint([city.lat,city.lng]),dart=$("dart"),endX=point.x-32,endY=point.y-32;
 dart.hidden=false;
 try{
  dartAnimation=dart.animate([
   {transform:"translate(-90px,-110px) rotate(-80deg) scale(2.7)",opacity:0},
   {transform:"translate("+(endX*.45)+"px,"+(endY-140)+"px) rotate(30deg) scale(1.7)",opacity:1,offset:.6},
   {transform:"translate("+endX+"px,"+endY+"px) rotate(0deg) scale(1)",opacity:1}
  ],{duration:reducedMotion.matches?1:1250,easing:"cubic-bezier(.2,.7,.4,1)",fill:"forwards"});
  await dartAnimation.finished;
 }catch{if(token!==generation)return}
 if(token!==generation||mode!=="B")return;
 dart.hidden=true;if(dartAnimation)dartAnimation.cancel();dartAnimation=null;busy=false;
 setMapInteraction(true);$("dartButton").disabled=false;$("dartButton").textContent="🎯 한 번 더 던지기";
 addMarker(city,true);celebrate();showCity(city,true);
});
$("modeA").addEventListener("click",()=>switchMode("A"));
$("modeB").addEventListener("click",()=>switchMode("B"));
$("resetButton").addEventListener("click",()=>{
 $("budget").value="";$("budget").removeAttribute("aria-invalid");switchMode("A");window.scrollTo({top:0,behavior:"instant"});
});
if(typeof L==="undefined"){
 $("recommendButton").disabled=true;$("dartButton").disabled=true;
 setStatus("지도 라이브러리를 불러오지 못했어요. 인터넷 연결 후 새로고침해주세요.");
}else{
 map=L.map("map",{minZoom:2,maxZoom:17,worldCopyJump:false});
 markerLayer=L.layerGroup().addTo(map);
 let tileWarningShown=false;
 L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png",{
  attribution:'&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors',maxZoom:19,noWrap:true
 }).on("tileerror",()=>{
  if(!tileWarningShown){tileWarningShown=true;setStatus("지도 배경을 불러오지 못했어요. 인터넷 연결을 확인해주세요. 추천 기능은 계속 사용할 수 있어요.")}
 }).addTo(map);
 switchMode("A");
}
</script>
</body>
</html>
