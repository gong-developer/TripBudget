services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: backend/.env
    environment:
      APP_DATA_DIR: /data
      DESTINATION_DB: /data/destinations.sqlite3
      API_LIMIT_DB: /data/api-limits.sqlite3
      MAP_TRANSLATION_CACHE: /data/map-translations.sqlite3
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      FORWARDED_ALLOW_IPS: ${FORWARDED_ALLOW_IPS:-127.0.0.1}
    ports:
      - "0.0.0.0:8000:8000"
    volumes:
      - app-data:/data
  translation:
    profiles: [manual-translation]
    build:
      context: .
      dockerfile: Dockerfile.translation
    restart: unless-stopped
    volumes:
      - translation-models:/models
volumes:
  app-data:
  translation-models:
